<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi Rutina de Gym</title>
<style>
:root{
  --bg:#f5f4f1; --card:#ffffff; --text:#1c1b19; --muted:#6b6862;
  --accent:#d1521a; --accent2:#1c1b19; --border:#e4e1da; --good:#3a7d44; --pending:#c98a1a;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151412; --card:#201f1c; --text:#f2f0ec; --muted:#a19c92;
    --accent:#e8693a; --accent2:#f2f0ec; --border:#33312c;
  }
}
:root[data-theme="dark"]{
  --bg:#151412; --card:#201f1c; --text:#f2f0ec; --muted:#a19c92;
  --accent:#e8693a; --accent2:#f2f0ec; --border:#33312c;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;
  min-height:100%;
}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 60px}
header{margin-bottom:14px}
h1{font-size:1.4rem;margin:0 0 4px;letter-spacing:-0.02em}
.sub{color:var(--muted);font-size:0.9rem;margin:0}

.week-label{font-size:0.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:16px 0 6px}
.weeks{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.weeks::-webkit-scrollbar{height:6px}
.weeks::-webkit-scrollbar-thumb{background:var(--border);border-radius:999px}
.weeks::-webkit-scrollbar-track{background:transparent}
.weekchip{
  flex:0 0 auto;padding:8px 12px;border-radius:10px;border:1px solid var(--border);
  background:var(--card);color:var(--text);font-size:0.78rem;cursor:pointer;white-space:nowrap;text-align:left;
}
.weekchip .tag-now{display:block;font-size:0.65rem;color:var(--accent);font-weight:700;margin-top:2px}
.weekchip.active{background:var(--accent2);border-color:var(--accent2);color:var(--bg);font-weight:600}
.weekchip.active .tag-now{color:var(--bg)}
.weekchip .wdot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--good);margin-left:5px;vertical-align:middle}
.weekchip.add{border-style:dashed;color:var(--muted);font-weight:700;text-align:center}
.past-panel{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 10px;padding:10px;border:1px dashed var(--border);border-radius:10px;background:var(--bg)}

.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:10px 0 14px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto;padding:8px 14px;border-radius:999px;border:1px solid var(--border);
  background:var(--card);color:var(--text);font-size:0.85rem;cursor:pointer;white-space:nowrap;
}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.tab .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--good);margin-left:6px;vertical-align:middle}

.card{
  background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:16px;margin-bottom:14px;
}
.card h2{font-size:1.05rem;margin:0 0 10px}
.muscle-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.tag{background:var(--bg);border:1px solid var(--border);color:var(--muted);font-size:0.75rem;padding:3px 9px;border-radius:999px}

.creatine-row{
  display:flex;align-items:center;justify-content:space-between;
  background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:14px;
}
.creatine-row .label{font-size:0.9rem}
.creatine-row .label small{display:block;color:var(--muted);font-weight:400}
.switch{
  width:44px;height:26px;border-radius:999px;border:1px solid var(--border);
  background:var(--bg);position:relative;cursor:pointer;flex:0 0 auto;
}
.switch.on{background:var(--good);border-color:var(--good)}
.switch::after{
  content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;
  background:var(--card);transition:transform .15s;
}
.switch.on::after{transform:translateX(18px);background:#fff}

form.setform{display:grid;grid-template-columns:1.4fr 1fr 1fr auto;gap:8px;margin-bottom:12px}
form.setform select, form.setform input{
  padding:9px 8px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:0.85rem;width:100%;
}
form.setform button{
  background:var(--accent2);color:var(--bg);border:none;border-radius:8px;padding:9px 12px;font-size:0.85rem;cursor:pointer;font-weight:600;
}
.setlist{display:flex;flex-direction:column;gap:6px}
.setitem{
  display:flex;align-items:center;justify-content:space-between;background:var(--bg);
  border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:0.85rem;
}
.setitem .meta{color:var(--muted);font-size:0.78rem}
.setitem .del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:1rem;padding:2px 6px}
.empty{color:var(--muted);font-size:0.85rem;padding:6px 2px}

.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.summary-item{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.summary-item .name{font-size:0.85rem;font-weight:600;margin-bottom:6px;display:flex;justify-content:space-between}
.summary-item .name span{color:var(--muted);font-weight:400}
.bar{height:7px;border-radius:999px;background:var(--border);overflow:hidden}
.bar-fill{height:100%;background:var(--accent);border-radius:999px}
.bar-fill.done{background:var(--good)}

.rest{color:var(--muted);font-size:0.9rem;padding:8px 0}
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi-item{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:14px 10px;text-align:center}
.kpi-value{font-size:1.5rem;font-weight:700;color:var(--accent)}
.kpi-label{font-size:0.72rem;color:var(--muted);margin-top:4px;line-height:1.2}
.footer-actions{display:flex;justify-content:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.reset-btn{background:none;border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:8px 14px;font-size:0.8rem;cursor:pointer}
.logout-btn{background:none;border:1px solid var(--border);color:var(--accent);border-radius:8px;padding:8px 14px;font-size:0.8rem;cursor:pointer}

#auth-screen{display:none;min-height:100vh;align-items:center;justify-content:center;padding:20px}
.auth-card{width:100%;max-width:360px;margin:0 auto;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:28px 24px;text-align:center}
.auth-card h1{font-size:1.3rem;margin:0 0 6px}
.auth-card p{font-size:0.85rem;color:var(--muted);margin:0 0 18px;line-height:1.4}
.auth-card input{width:100%;padding:11px 13px;margin-bottom:10px;border:1px solid var(--border);border-radius:10px;font-size:15px;font-family:inherit;color:var(--text);background:var(--bg)}
.btn-auth{width:100%;padding:11px;border-radius:10px;border:none;font-size:0.9rem;font-weight:700;background:var(--accent2);color:var(--bg);margin-top:4px;cursor:pointer}
.btn-auth.secondary{background:none;color:var(--accent);border:1.5px solid var(--accent)}
.auth-error{font-size:0.78rem;color:#c0392b;margin-top:10px;display:none}
.auth-loading{font-size:0.78rem;color:var(--muted);margin-top:10px}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body>
<div id="auth-screen">
  <div class="auth-card">
    <h1>🏋️ Mi Rutina de Gym</h1>
    <p>Inicia sesión para guardar tu progreso en la nube y verlo desde cualquier dispositivo.</p>
    <input type="email" id="auth-email" placeholder="Correo electrónico" autocomplete="username">
    <input type="password" id="auth-password" placeholder="Contraseña (mín. 6 caracteres)" autocomplete="current-password">
    <button class="btn-auth" id="auth-login">Entrar</button>
    <button class="btn-auth secondary" id="auth-signup">Crear cuenta nueva</button>
    <p class="auth-error" id="auth-error"></p>
    <p class="auth-loading" id="auth-loading" style="display:none;">Conectando…</p>
  </div>
</div>
<div class="wrap" id="app">
  <header>
    <h1>🏋️ Mi Rutina de Gym</h1>
    <p class="sub">Registro de sets, creatina e historial por semanas</p>
  </header>

  <div class="week-label">Semana</div>
  <div id="weeksContainer"></div>

  <div class="tabs" id="tabs"></div>

  <div id="dayContent"></div>

  <div class="card">
    <h2>Resumen de la semana seleccionada</h2>
    <div class="summary-grid" id="summary"></div>
  </div>

  <div class="card">
    <h2>KPIs</h2>
    <div class="kpi-grid" id="kpis"></div>
  </div>

  <div class="footer-actions">
    <button class="reset-btn" id="resetBtn">Borrar semana seleccionada</button>
    <button class="logout-btn" id="logoutBtn" style="display:none;">Cerrar sesión</button>
  </div>
</div>

<script>
const DAY_DEFS = [
  {key:"lunes", label:"Lunes", muscles:["Bicep","Hombro","Tricep"]},
  {key:"martes", label:"Martes", muscles:["Pecho","Espalda"]},
  {key:"miercoles", label:"Miércoles", muscles:["Bicep","Hombro","Tricep"]},
  {key:"jueves", label:"Jueves", muscles:["Pecho","Espalda"]},
  {key:"viernes", label:"Viernes", muscles:["Pierna"]},
  {key:"sabado", label:"Sábado", muscles:[]},
  {key:"domingo", label:"Domingo", muscles:[]},
];
const GOAL_PER_MUSCLE_WEEK = 18;
const STORAGE_KEY = "gymTrackerData_v2";
const MONTHS = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];

// ---------- Firebase (login + guardado en la nube) ----------
// Rellena esto con la configuración de TU proyecto de Firebase (Configuración del
// proyecto → General → "Tus apps" → app web). Es gratis. Mientras esté sin rellenar,
// la app sigue funcionando como hasta ahora, guardando solo en este navegador.
const firebaseConfig = {
  apiKey: "AIzaSyCTAgx2AwwLIPzLxg1dRrRLUNszMynqA4o",
  authDomain: "mi-rutina-gym-89e97.firebaseapp.com",
  projectId: "mi-rutina-gym-89e97",
  storageBucket: "mi-rutina-gym-89e97.firebasestorage.app",
  messagingSenderId: "275613453777",
  appId: "1:275613453777:web:5a75411a75a9ec127ea4f0",
};
const FIREBASE_CONFIGURED = firebaseConfig.apiKey !== "TU_API_KEY";
let auth = null, db = null, currentUser = null;
if (FIREBASE_CONFIGURED) {
  firebase.initializeApp(firebaseConfig);
  auth = firebase.auth();
  db = firebase.firestore();
}

function traducirErrorAuth(code) {
  const map = {
    "auth/invalid-email": "Ese correo no es válido.",
    "auth/user-not-found": "No existe ninguna cuenta con ese correo.",
    "auth/wrong-password": "Contraseña incorrecta.",
    "auth/invalid-credential": "Correo o contraseña incorrectos.",
    "auth/email-already-in-use": "Ya existe una cuenta con ese correo. Prueba a entrar en vez de crear una nueva.",
    "auth/weak-password": "La contraseña necesita al menos 6 caracteres.",
    "auth/missing-password": "Escribe una contraseña.",
    "auth/too-many-requests": "Demasiados intentos. Espera un poco y vuelve a probar.",
  };
  return map[code] || "Ha ocurrido un error. Inténtalo de nuevo.";
}

function showAuthScreen(){
  document.getElementById("auth-screen").style.display = "flex";
  document.getElementById("app").style.display = "none";
}
function showApp(){
  document.getElementById("auth-screen").style.display = "none";
  document.getElementById("app").style.display = "block";
  document.getElementById("logoutBtn").style.display = FIREBASE_CONFIGURED ? "inline-block" : "none";
}

function setupAuthHandlers(){
  const emailEl = document.getElementById("auth-email");
  const passEl = document.getElementById("auth-password");
  const errEl = document.getElementById("auth-error");
  const loadingEl = document.getElementById("auth-loading");

  function setBusy(busy){
    loadingEl.style.display = busy ? "block" : "none";
    document.getElementById("auth-login").disabled = busy;
    document.getElementById("auth-signup").disabled = busy;
  }
  function showErr(code){
    errEl.textContent = traducirErrorAuth(code);
    errEl.style.display = "block";
  }

  document.getElementById("auth-login").onclick = async ()=>{
    errEl.style.display = "none";
    setBusy(true);
    try{ await auth.signInWithEmailAndPassword(emailEl.value.trim(), passEl.value); }
    catch(e){ showErr(e.code); }
    finally{ setBusy(false); }
  };
  document.getElementById("auth-signup").onclick = async ()=>{
    errEl.style.display = "none";
    setBusy(true);
    try{ await auth.createUserWithEmailAndPassword(emailEl.value.trim(), passEl.value); }
    catch(e){ showErr(e.code); }
    finally{ setBusy(false); }
  };
}

async function storageGet(key){
  if(FIREBASE_CONFIGURED && currentUser){
    try{
      const doc = await db.collection("gymTracker").doc(currentUser.uid).get();
      const d = doc.exists ? doc.data() : {};
      return d[key] !== undefined ? d[key] : null;
    }catch(e){ console.error("Error leyendo de Firestore", e); return null; }
  }
  try{ return localStorage.getItem(key); }catch(e){ return null; }
}
async function storageSet(key, value){
  if(FIREBASE_CONFIGURED && currentUser){
    try{
      await db.collection("gymTracker").doc(currentUser.uid).set({ [key]: value }, { merge:true });
      return true;
    }catch(e){ console.error("Error guardando en Firestore", e); return false; }
  }
  try{ localStorage.setItem(key, value); return true; }catch(e){ return false; }
}

function getMonday(date){
  const d = new Date(date);
  const day = d.getDay();
  const diff = day===0 ? -6 : 1-day;
  d.setDate(d.getDate()+diff);
  d.setHours(0,0,0,0);
  return d;
}
function fmtKey(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), dd=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${dd}`;
}
function fmtShort(d){
  return `${d.getDate()} ${MONTHS[d.getMonth()]}`;
}

const today = new Date();
const currentMonday = getMonday(today);
const lastMonday = new Date(currentMonday); lastMonday.setDate(lastMonday.getDate()-7);

function makeWeekObj(monday){
  const sunday = new Date(monday); sunday.setDate(sunday.getDate()+6);
  return { key: fmtKey(monday), monday: new Date(monday), sunday, label: `${fmtShort(monday)} - ${fmtShort(sunday)}` };
}

let WEEKS = [];
let c = new Date(lastMonday);
while(c <= currentMonday){ WEEKS.push(makeWeekObj(c)); c = new Date(c); c.setDate(c.getDate()+7); }
const CURRENT_WEEK_KEY = fmtKey(currentMonday);

function freshWeek(){
  const w = {};
  DAY_DEFS.forEach(d=> w[d.key] = {creatine:false, sets:[]});
  return w;
}
async function loadData(){
  try{
    const raw = await storageGet(STORAGE_KEY);
    if(raw) data = JSON.parse(raw);
  }catch(e){}
  if(!data.weeks) data.weeks = {};
}
async function saveData(){ await storageSet(STORAGE_KEY, JSON.stringify(data)); }

let data = { weeks:{} };

function initWeeks(){
  Object.keys(data.weeks).sort().forEach(k=>{
    if(!WEEKS.find(w=>w.key===k)){
      const d = new Date(k+"T00:00:00");
      if(d > currentMonday) WEEKS.push(makeWeekObj(d));
    }
  });
  WEEKS.sort((a,b)=> a.monday - b.monday);
}
function ensureWeek(key){ if(!data.weeks[key]) data.weeks[key] = freshWeek(); return data.weeks[key]; }

let activeWeek = CURRENT_WEEK_KEY;
let foldersOpen = false;
const jsDay = today.getDay();
let activeDay = DAY_DEFS[jsDay===0?6:jsDay-1].key;

function renderWeeks(){
  const container = document.getElementById("weeksContainer");
  container.innerHTML = "";

  const pastWeeks = WEEKS.filter(w=> w.monday < currentMonday);
  const presentFuture = WEEKS.filter(w=> w.monday >= currentMonday);

  const row = document.createElement("div");
  row.className = "weeks";

  if(pastWeeks.length>0){
    const anyPastData = pastWeeks.some(w=>{
      const wd = data.weeks[w.key];
      return wd && DAY_DEFS.some(d=> wd[d.key].sets.length>0 || wd[d.key].creatine);
    });
    const folderBtn = document.createElement("button");
    folderBtn.className = "weekchip" + (foldersOpen ? " active":"");
    folderBtn.innerHTML = `📁 Semanas anteriores (${pastWeeks.length})` + (anyPastData ? '<span class="wdot"></span>' : '');
    folderBtn.onclick = ()=>{ foldersOpen = !foldersOpen; renderAll(); };
    row.appendChild(folderBtn);
  }

  presentFuture.forEach(w=>{
    const btn = document.createElement("button");
    btn.className = "weekchip" + (w.key===activeWeek ? " active":"");
    const wd = data.weeks[w.key];
    const hasData = wd && DAY_DEFS.some(d=> wd[d.key].sets.length>0 || wd[d.key].creatine);
    btn.innerHTML = w.label + (hasData ? '<span class="wdot"></span>' : '') + (w.key===CURRENT_WEEK_KEY ? '<span class="tag-now">ACTUAL</span>' : '');
    btn.onclick = ()=>{ activeWeek = w.key; renderAll(); };
    row.appendChild(btn);
  });

  const addBtn = document.createElement("button");
  addBtn.className = "weekchip add";
  const nextMonday = new Date(WEEKS[WEEKS.length-1].monday);
  nextMonday.setDate(nextMonday.getDate()+7);
  addBtn.innerHTML = `+ ${fmtShort(nextMonday)}`;
  addBtn.onclick = ()=>{
    const w = makeWeekObj(nextMonday);
    WEEKS.push(w);
    ensureWeek(w.key);
    saveData();
    activeWeek = w.key;
    activeDay = "lunes";
    renderAll();
  };
  row.appendChild(addBtn);

  container.appendChild(row);

  if(foldersOpen && pastWeeks.length>0){
    const panel = document.createElement("div");
    panel.className = "past-panel";
    pastWeeks.forEach(w=>{
      const btn = document.createElement("button");
      btn.className = "weekchip" + (w.key===activeWeek ? " active":"");
      const wd = data.weeks[w.key];
      const hasData = wd && DAY_DEFS.some(d=> wd[d.key].sets.length>0 || wd[d.key].creatine);
      btn.innerHTML = w.label + (hasData ? '<span class="wdot"></span>' : '') + (w.key===fmtKey(lastMonday) ? '<span class="tag-now" style="color:var(--pending)">SEMANA PASADA</span>' : '');
      btn.onclick = ()=>{ activeWeek = w.key; foldersOpen = false; renderAll(); };
      panel.appendChild(btn);
    });
    container.appendChild(panel);
  }
}

function renderTabs(){
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = "";
  const wd = ensureWeek(activeWeek);
  DAY_DEFS.forEach(d=>{
    const btn = document.createElement("button");
    btn.className = "tab" + (d.key===activeDay ? " active":"");
    btn.textContent = d.label;
    if(wd[d.key].creatine){
      const dot = document.createElement("span");
      dot.className = "dot";
      btn.appendChild(dot);
    }
    btn.onclick = ()=>{ activeDay = d.key; renderAll(); };
    tabs.appendChild(btn);
  });
}

function renderDayContent(){
  const container = document.getElementById("dayContent");
  const day = DAY_DEFS.find(d=>d.key===activeDay);
  const wd = ensureWeek(activeWeek);
  const d = wd[day.key];
  container.innerHTML = "";

  const card = document.createElement("div");
  card.className = "card";

  const h2 = document.createElement("h2");
  h2.textContent = day.label;
  card.appendChild(h2);

  const tagsWrap = document.createElement("div");
  tagsWrap.className = "muscle-tags";
  if(day.muscles.length===0){
    const t = document.createElement("span");
    t.className = "tag";
    t.textContent = "Descanso";
    tagsWrap.appendChild(t);
  } else {
    day.muscles.forEach(m=>{
      const t = document.createElement("span");
      t.className = "tag";
      t.textContent = m;
      tagsWrap.appendChild(t);
    });
  }
  card.appendChild(tagsWrap);

  const crow = document.createElement("div");
  crow.className = "creatine-row";
  crow.innerHTML = `<div class="label">💊 Creatina<small>Toma diaria de suplementación</small></div>`;
  const sw = document.createElement("div");
  sw.className = "switch" + (d.creatine ? " on":"");
  sw.onclick = ()=>{ d.creatine = !d.creatine; saveData(); renderAll(); };
  crow.appendChild(sw);
  card.appendChild(crow);

  if(day.muscles.length>0){
    const form = document.createElement("form");
    form.className = "setform";
    form.innerHTML = `
      <select id="muscleSel"></select>
      <input type="number" id="repsInput" placeholder="Reps" min="1" />
      <input type="number" id="setsInput" placeholder="Sets" min="1" value="3" />
      <button type="submit">+ Añadir</button>
    `;
    card.appendChild(form);

    const sel = form.querySelector("#muscleSel");
    day.muscles.forEach(m=>{
      const opt = document.createElement("option");
      opt.value = m; opt.textContent = m;
      sel.appendChild(opt);
    });

    form.onsubmit = (e)=>{
      e.preventDefault();
      const muscle = sel.value;
      const reps = form.querySelector("#repsInput").value || "-";
      const sets = Number(form.querySelector("#setsInput").value) || 1;
      d.sets.push({muscle, reps, sets, id: Date.now()+Math.random()});
      saveData();
      renderAll();
    };

    const listWrap = document.createElement("div");
    listWrap.className = "setlist";
    if(d.sets.length===0){
      const e = document.createElement("div");
      e.className = "empty";
      e.textContent = "Aún no registraste sets este día.";
      listWrap.appendChild(e);
    } else {
      d.sets.slice().reverse().forEach(s=>{
        const item = document.createElement("div");
        item.className = "setitem";
        item.innerHTML = `<span><strong>${s.muscle}</strong> — ${s.sets} sets <span class="meta">${s.reps!=="-"? "x "+s.reps+" reps":""}</span></span>`;
        const del = document.createElement("button");
        del.className = "del";
        del.textContent = "✕";
        del.onclick = ()=>{
          d.sets = d.sets.filter(x=>x.id!==s.id);
          saveData(); renderAll();
        };
        item.appendChild(del);
        listWrap.appendChild(item);
      });
    }
    card.appendChild(listWrap);
  } else {
    const rest = document.createElement("div");
    rest.className = "rest";
    rest.textContent = "Día de descanso. No olvides tu creatina 💪";
    card.appendChild(rest);
  }

  container.appendChild(card);
}

function escapeHtml(str){
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function renderSummary(){
  const summary = document.getElementById("summary");
  summary.innerHTML = "";
  const wd = ensureWeek(activeWeek);
  const totals = {};
  DAY_DEFS.forEach(day=>{
    wd[day.key].sets.forEach(s=>{
      totals[s.muscle] = (totals[s.muscle]||0) + Number(s.sets||1);
    });
  });
  const allMuscles = ["Bicep","Hombro","Tricep","Pecho","Espalda","Pierna"];
  allMuscles.forEach(m=>{
    const count = totals[m] || 0;
    const goal = m==="Pierna" ? 9 : GOAL_PER_MUSCLE_WEEK;
    const pct = Math.min(100, Math.round((count/goal)*100));
    const item = document.createElement("div");
    item.className = "summary-item";
    item.innerHTML = `
      <div class="name">${m} <span>${count}/${goal}</span></div>
      <div class="bar"><div class="bar-fill ${count>=goal?'done':''}" style="width:${pct}%"></div></div>
    `;
    summary.appendChild(item);
  });

  const creatineDays = DAY_DEFS.filter(d=> wd[d.key].creatine).length;
  const cPct = Math.round((creatineDays/7)*100);
  const cItem = document.createElement("div");
  cItem.className = "summary-item";
  cItem.innerHTML = `
    <div class="name">💊 Creatina <span>${creatineDays}/7 días</span></div>
    <div class="bar"><div class="bar-fill ${creatineDays>=7?'done':''}" style="width:${cPct}%"></div></div>
  `;
  summary.appendChild(cItem);
}

function weekTotalSets(wd){
  let sum = 0;
  DAY_DEFS.forEach(d=> wd[d.key].sets.forEach(s=> sum += Number(s.sets||1)));
  return sum;
}
function totalGoalPerWeek(){ return GOAL_PER_MUSCLE_WEEK*5 + 9; }

function renderKPIs(){
  const el = document.getElementById("kpis");
  el.innerHTML = "";
  const goalTotal = totalGoalPerWeek();

  let streak = 0;
  let dPtr = new Date(); dPtr.setHours(0,0,0,0);
  while(true){
    const wk = fmtKey(getMonday(dPtr));
    const wdz = data.weeks[wk];
    const dayKey = DAY_DEFS[dPtr.getDay()===0?6:dPtr.getDay()-1].key;
    if(wdz && wdz[dayKey] && wdz[dayKey].creatine){
      streak++;
      dPtr.setDate(dPtr.getDate()-1);
    } else break;
  }

  const curWd = data.weeks[CURRENT_WEEK_KEY] || freshWeek();
  const curTotal = weekTotalSets(curWd);
  const curPct = Math.min(100, Math.round((curTotal/goalTotal)*100));

  let totalAllSets = 0, weeksCompleted = 0, weeksCount = 0;
  Object.keys(data.weeks).forEach(k=>{
    const wd = data.weeks[k];
    const t = weekTotalSets(wd);
    totalAllSets += t;
    weeksCount++;
    if(t >= goalTotal) weeksCompleted++;
  });

  const tiles = [
    { value: streak, label: "Días seguidos con creatina" },
    { value: curPct+"%", label: "Cumplimiento semana actual" },
    { value: totalAllSets, label: "Sets totales registrados" },
    { value: weeksCompleted+"/"+weeksCount, label: "Semanas con objetivo cumplido" },
  ];
  tiles.forEach(t=>{
    const item = document.createElement("div");
    item.className = "kpi-item";
    item.innerHTML = `<div class="kpi-value">${t.value}</div><div class="kpi-label">${t.label}</div>`;
    el.appendChild(item);
  });
}

function renderAll(){
  renderWeeks();
  renderTabs();
  renderDayContent();
  renderSummary();
  renderKPIs();
}

document.getElementById("resetBtn").onclick = ()=>{
  const w = WEEKS.find(w=>w.key===activeWeek);
  if(confirm(`¿Borrar todos los datos de la semana ${w.label}?`)){
    data.weeks[activeWeek] = freshWeek();
    saveData();
    renderAll();
  }
};
document.getElementById("logoutBtn").onclick = ()=>{ if(auth) auth.signOut(); };

async function init(){
  if(FIREBASE_CONFIGURED){
    setupAuthHandlers();
    showAuthScreen();
    auth.onAuthStateChanged(async (user)=>{
      if(user){
        currentUser = user;
        showApp();
        await loadData();
        initWeeks();
        renderAll();
      } else {
        currentUser = null;
        showAuthScreen();
      }
    });
  } else {
    document.getElementById("app").style.display = "block";
    await loadData();
    initWeeks();
    renderAll();
  }
}
init();
</script>
